[package]
name = "rust-go-decode"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
prost = "0.14"
snap = "1.1"

[dev-dependencies]
benchfmt = { git = "https://github.com/bwplotka/benchfmt.rs", features = ["pprof"] }
criterion = { version = "0.8", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "criterion_decode"
harness = false

[[bench]]
name = "suite_decode"
harness = false

[[bin]]
name = "verify_decode"
path = "src/bin/verify_decode.rs"

[profile.bench]
debug = 1
